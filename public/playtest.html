<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MOLGANG — Playtest Feedback (GTA6 realism)</title>
<style>
  :root { --bg:#0f1117; --card:#171a23; --bd:#262b38; --tx:#e6e8ee; --mut:#8b92a5;
          --dev:#60a5fa; --des:#f59e0b; --crit:#ef4444; --high:#f97316; --med:#eab308; --low:#22c55e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--tx); font:14px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; }
  header { padding:24px 28px; border-bottom:1px solid var(--bd); }
  h1 { margin:0 0 4px; font-size:22px; }
  .sub { color:var(--mut); font-size:13px; }
  .wrap { max-width:1100px; margin:0 auto; padding:24px 28px; }
  .scorecard { display:flex; gap:16px; flex-wrap:wrap; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--bd); border-radius:10px; padding:14px 18px; min-width:140px; }
  .stat .n { font-size:26px; font-weight:700; }
  .stat .l { color:var(--mut); font-size:12px; text-transform:uppercase; letter-spacing:.4px; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:20px; }
  @media (max-width:840px){ .cols{ grid-template-columns:1fr; } }
  .track { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px 18px; }
  .track h2 { margin:0 0 12px; font-size:16px; }
  .track.dev h2 { color:var(--dev); } .track.des h2 { color:var(--des); }
  .item { border-top:1px solid var(--bd); padding:10px 0; }
  .item:first-of-type { border-top:none; }
  .item .t { font-weight:600; }
  .item .a { color:var(--mut); font-size:13px; margin-top:2px; }
  .sev { display:inline-block; font-size:11px; font-weight:700; padding:1px 7px; border-radius:20px; margin-right:8px; text-transform:uppercase; }
  .sev.critical{background:rgba(239,68,68,.15);color:var(--crit);} .sev.high{background:rgba(249,115,22,.15);color:var(--high);}
  .sev.medium{background:rgba(234,179,8,.15);color:var(--med);} .sev.low{background:rgba(34,197,94,.15);color:var(--low);}
  .top { background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px 18px; margin-bottom:20px; }
  .top ol { margin:8px 0 0; padding-left:22px; } .top li { margin:5px 0; }
  .badge { font-size:11px; color:var(--mut); border:1px solid var(--bd); border-radius:5px; padding:1px 6px; margin-left:6px; }
  .empty { color:var(--mut); padding:40px; text-align:center; }
  pre.md { white-space:pre-wrap; background:var(--card); border:1px solid var(--bd); border-radius:12px; padding:16px 18px; color:var(--tx); }
</style>
</head>
<body>
<header>
  <h1>🎮 MOLGANG — Playtest Feedback</h1>
  <div class="sub">virtualpc tester panel · GTA6-realism evaluation · <span id="when">—</span></div>
</header>
<div class="wrap" id="root"><div class="empty">Loading…</div></div>

<script>
const sev = s => `<span class="sev ${s||'low'}">${s||'low'}</span>`;
async function load() {
  const root = document.getElementById('root');
  let fb;
  try { const r = await fetch('/api/playtest/feedback'); const j = await r.json(); fb = j.data; }
  catch(e){ root.innerHTML = '<div class="empty">Could not load feedback.</div>'; return; }
  if (!fb) { root.innerHTML = '<div class="empty">No feedback yet — run the molgang-tester-panel workflow.</div>'; return; }
  document.getElementById('when').textContent = fb.generatedAt ? new Date(fb.generatedAt).toLocaleString() : '';

  const sc = fb.scorecard || {};
  const stats = Object.entries(sc).filter(([k,v])=>typeof v!=='object').map(([k,v])=>
    `<div class="stat"><div class="n">${v}</div><div class="l">${k.replace(/_/g,' ')}</div></div>`).join('');

  const top = (fb.top10||[]).map(t=>`<li>${sev(t.severity)}${t.item} <span class="badge">${t.track}</span></li>`).join('');

  const dev = (fb.developerTrack||[]).map(renderItem).join('') || '<div class="a">—</div>';
  const des = (fb.designerTrack||[]).map(renderItem).join('') || '<div class="a">—</div>';

  root.innerHTML =
    (stats?`<div class="scorecard">${stats}</div>`:'') +
    (top?`<div class="top"><h2>🔝 Do these first</h2><ol>${top}</ol></div>`:'') +
    `<div class="cols">
       <div class="track dev"><h2>👩‍💻 Developers</h2>${dev}</div>
       <div class="track des"><h2>🎨 3D Designers</h2>${des}</div>
     </div>` +
    (fb.reportMarkdown?`<h2 style="margin-top:26px">Full report</h2><pre class="md">${escapeHtml(fb.reportMarkdown)}</pre>`:'');
}
function renderItem(f){
  const title = f.item || f.area || f.asset || 'finding';
  const action = f.action || '';
  return `<div class="item"><div class="t">${sev(f.severity||f.priority)}${escapeHtml(title)}</div>${action?`<div class="a">${escapeHtml(action)}</div>`:''}</div>`;
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
load();
</script>
</body>
</html>
