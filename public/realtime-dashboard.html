<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VirtualPC Real-time Dashboard</title>
    <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #60a5fa;
            --primary-dark: #1e40af;
            --secondary: #06b6d4;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg-dark: #0f172a;
            --bg-darker: #020617;
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --border: rgba(148, 163, 184, 0.2);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
            color: var(--text-primary);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 16px;
            background: rgba(34, 197, 94, 0.1);
            border: 1px solid var(--success);
            border-radius: 6px;
            font-size: 0.9em;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        @media (max-width: 1200px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(10px);
        }

        .card h2 {
            font-size: 1.3em;
            margin-bottom: 15px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .hive-entry {
            padding: 12px;
            background: rgba(96, 165, 250, 0.05);
            border-left: 3px solid var(--primary);
            border-radius: 4px;
            margin-bottom: 10px;
            font-size: 0.95em;
        }

        .hive-entry-time {
            color: var(--text-secondary);
            font-size: 0.8em;
        }

        .hive-entry-agent {
            font-weight: 600;
            color: var(--secondary);
        }

        .hive-entry-action {
            color: var(--text-primary);
            margin-top: 4px;
        }

        .task {
            padding: 12px;
            background: rgba(34, 197, 94, 0.05);
            border-left: 3px solid var(--success);
            border-radius: 4px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-name {
            font-weight: 600;
            color: var(--text-primary);
        }

        .task-status {
            font-size: 0.85em;
            padding: 4px 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--success);
            border-radius: 4px;
            color: var(--success);
        }

        .agent {
            padding: 15px;
            background: rgba(6, 182, 212, 0.05);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 8px;
            margin-bottom: 10px;
        }

        .agent-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .agent-name {
            font-weight: 600;
            color: var(--secondary);
            font-size: 1.1em;
        }

        .agent-status {
            padding: 4px 10px;
            background: rgba(34, 197, 94, 0.2);
            border: 1px solid var(--success);
            border-radius: 4px;
            color: var(--success);
            font-size: 0.85em;
        }

        .agent-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            font-size: 0.9em;
        }

        .agent-info-item {
            color: var(--text-secondary);
        }

        .agent-info-value {
            color: var(--text-primary);
            font-weight: 600;
        }

        .meta-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-top: 20px;
        }

        .meta-item {
            text-align: center;
            padding: 15px;
            background: rgba(96, 165, 250, 0.05);
            border: 1px solid var(--border);
            border-radius: 8px;
        }

        .meta-label {
            color: var(--text-secondary);
            font-size: 0.85em;
            margin-bottom: 8px;
        }

        .meta-value {
            font-size: 1.5em;
            font-weight: 700;
            color: var(--primary);
            font-family: 'Monaco', 'Courier New', monospace;
        }

        .empty-state {
            color: var(--text-secondary);
            text-align: center;
            padding: 30px;
            font-style: italic;
        }

        .scroll-area {
            max-height: 400px;
            overflow-y: auto;
        }

        .scroll-area::-webkit-scrollbar {
            width: 6px;
        }

        .scroll-area::-webkit-scrollbar-track {
            background: rgba(148, 163, 184, 0.1);
            border-radius: 3px;
        }

        .scroll-area::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }

        .scroll-area::-webkit-scrollbar-thumb:hover {
            background: rgba(148, 163, 184, 0.5);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴 Real-time Dashboard</h1>
            <div class="status-indicator">
                <div class="status-dot"></div>
                <span id="connection-status">Connecting...</span>
            </div>
        </header>

        <div class="dashboard-grid">
            <!-- Hive Mind Activity -->
            <div class="card">
                <h2>🧠 Hive Mind Activity</h2>
                <div class="scroll-area" id="hive-mind-list">
                    <div class="empty-state">Loading agent activity...</div>
                </div>
            </div>

            <!-- Task Status -->
            <div class="card">
                <h2>📋 Tasks</h2>
                <div class="scroll-area" id="tasks-list">
                    <div class="empty-state">No tasks yet...</div>
                </div>
            </div>

            <!-- Agents Status -->
            <div class="card" style="grid-column: 1 / -1;">
                <h2>👥 Agent Team Status</h2>
                <div id="agents-list">
                    <div class="empty-state">Waiting for agent data...</div>
                </div>
            </div>

            <!-- Token Usage -->
            <div class="card">
                <h2>💰 Token Usage</h2>
                <div class="meta-info" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="meta-item">
                        <div class="meta-label">Hourly Cost</div>
                        <div class="meta-value" id="hourly-cost">$-</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Daily Cost</div>
                        <div class="meta-value" id="daily-cost">$-</div>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <h3 style="font-size: 0.95em; color: var(--text-secondary); margin-bottom: 10px;">By Agent</h3>
                    <div id="token-by-agent" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px;">
                        <div class="empty-state">No token usage yet</div>
                    </div>
                </div>
            </div>

            <!-- System Metrics -->
            <div class="card">
                <h2>⚙️ System Metrics</h2>
                <div class="meta-info" style="grid-template-columns: 1fr 1fr; gap: 15px;">
                    <div class="meta-item">
                        <div class="meta-label">Server Uptime</div>
                        <div class="meta-value" id="uptime">-</div>
                    </div>
                    <div class="meta-item">
                        <div class="meta-label">Memory Usage</div>
                        <div class="meta-value" id="memory">-</div>
                    </div>
                </div>
                <div style="margin-top: 15px;">
                    <div class="meta-label">Last Update</div>
                    <div class="meta-value" id="last-update" style="font-size: 1.2em; margin-top: 10px;">-</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io({
            reconnection: true,
            reconnectionDelay: 1000,
            reconnectionDelayMax: 5000,
            reconnectionAttempts: 5
        });

        // Connection events
        socket.on('connect', () => {
            console.log('Connected to real-time dashboard');
            document.getElementById('connection-status').textContent = 'Connected';
            document.getElementById('connection-status').parentElement.style.borderColor = 'var(--success)';
            socket.emit('request-initial-state');
        });

        socket.on('disconnect', () => {
            console.log('Disconnected from real-time dashboard');
            document.getElementById('connection-status').textContent = 'Disconnected';
            document.getElementById('connection-status').parentElement.style.borderColor = 'var(--danger)';
        });

        // Dashboard state updates
        socket.on('dashboard-state', (state) => {
            updateDashboard(state);
        });

        socket.on('dashboard-update', (state) => {
            updateDashboard(state);
        });

        function updateDashboard(state) {
            if (!state) return;

            // Update Hive Mind
            if (state.hive_mind?.recent_entries?.length > 0) {
                const hiveMindHtml = state.hive_mind.recent_entries
                    .reverse()
                    .slice(0, 10)
                    .map(entry => `
                        <div class="hive-entry">
                            <div class="hive-entry-time">${new Date(entry.timestamp).toLocaleTimeString()}</div>
                            <div><span class="hive-entry-agent">${entry.agentId}</span> • ${entry.actionType}</div>
                            <div class="hive-entry-action">${entry.summary}</div>
                        </div>
                    `).join('');
                document.getElementById('hive-mind-list').innerHTML = hiveMindHtml || '<div class="empty-state">No activity yet</div>';
            }

            // Update Tasks
            if (state.tasks?.all?.length > 0) {
                const tasksHtml = state.tasks.all
                    .slice(0, 10)
                    .map(task => `
                        <div class="task">
                            <div class="task-name">${task.title || 'Untitled Task'}</div>
                            <div class="task-status">${task.status || 'pending'}</div>
                        </div>
                    `).join('');
                document.getElementById('tasks-list').innerHTML = tasksHtml || '<div class="empty-state">No tasks</div>';
            } else {
                document.getElementById('tasks-list').innerHTML = '<div class="empty-state">No tasks</div>';
            }

            // Update Agents
            if (state.agents?.agents && Object.keys(state.agents.agents).length > 0) {
                const agentsHtml = Object.entries(state.agents.agents)
                    .map(([name, data]: any) => `
                        <div class="agent">
                            <div class="agent-header">
                                <div class="agent-name">${name}</div>
                                <div class="agent-status">${data.status || 'idle'}</div>
                            </div>
                            <div class="agent-info">
                                <div class="agent-info-item">Role: <span class="agent-info-value">${data.role || '-'}</span></div>
                                <div class="agent-info-item">Messages: <span class="agent-info-value">${data.message_count || 0}</span></div>
                            </div>
                        </div>
                    `).join('');
                document.getElementById('agents-list').innerHTML = agentsHtml || '<div class="empty-state">No agents active</div>';
            }

            // Update Token Usage
            if (state.tokens) {
                const hourlyStr = state.tokens.hourly_total
                    ? `$${state.tokens.hourly_total.toFixed(4)}`
                    : '$0.00';
                const dailyStr = state.tokens.daily_total
                    ? `$${state.tokens.daily_total.toFixed(4)}`
                    : '$0.00';

                document.getElementById('hourly-cost').textContent = hourlyStr;
                document.getElementById('daily-cost').textContent = dailyStr;

                // Token usage by agent
                if (state.tokens.agents && Object.keys(state.tokens.agents).length > 0) {
                    const agentTokensHtml = Object.entries(state.tokens.agents)
                        .map(([agent, data]: any) => `
                            <div style="padding: 8px; background: rgba(96, 165, 250, 0.05); border-radius: 4px; font-size: 0.85em;">
                                <div style="font-weight: 600; color: var(--secondary); margin-bottom: 4px;">${agent}</div>
                                <div style="color: var(--text-secondary);">
                                    ${data.prompt_tokens || 0} input<br/>
                                    ${data.completion_tokens || 0} output<br/>
                                    <strong>$${(data.total_cost || 0).toFixed(4)}</strong>
                                </div>
                            </div>
                        `).join('');
                    document.getElementById('token-by-agent').innerHTML = agentTokensHtml || '<div class="empty-state">No usage</div>';
                } else {
                    document.getElementById('token-by-agent').innerHTML = '<div class="empty-state">No usage yet</div>';
                }
            }

            // Update Metrics
            if (state.meta) {
                const uptime = formatUptime(state.meta.server_uptime);
                const memory = formatBytes(state.meta.memory_usage?.heapUsed || 0);
                const lastUpdate = new Date(state.timestamp).toLocaleTimeString();

                document.getElementById('uptime').textContent = uptime;
                document.getElementById('memory').textContent = memory;
                document.getElementById('last-update').textContent = lastUpdate;
            }
        }

        function formatUptime(seconds) {
            const hours = Math.floor(seconds / 3600);
            const minutes = Math.floor((seconds % 3600) / 60);
            const secs = Math.floor(seconds % 60);
            return `${hours}h ${minutes}m ${secs}s`;
        }

        function formatBytes(bytes) {
            if (bytes === 0) return '0 B';
            const k = 1024;
            const sizes = ['B', 'KB', 'MB', 'GB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round(bytes / Math.pow(k, i) * 100) / 100 + ' ' + sizes[i];
        }
    </script>
</body>
</html>
