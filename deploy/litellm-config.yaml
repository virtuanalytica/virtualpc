# LiteLLM unified gateway configuration for VirtualPC.
#
# Aggregates local LM Studio (port 1234) plus every cloud provider we have
# credentials for. Generated by scripts/litellm-config-from-credentials.py
# but committed with sensible defaults so it works out-of-the-box for the
# local-only path even before any cloud key is set.
#
# Bring up:
#   docker compose -f deploy/docker-compose.litellm.yml up -d
#   curl http://localhost:4000/v1/models
#
# Point VirtualPC at it by exporting LITELLM_URL=http://127.0.0.1:4000/v1
# before starting the server.

model_list:
  # ─── Local LM Studio (always available, free) ────────────────────────────
  - model_name: phi-4
    litellm_params:
      model: openai/microsoft/phi-4
      api_base: http://127.0.0.1:1234/v1
      api_key: lm-studio  # LM Studio ignores the value but the SDK requires one
  - model_name: gemma-4-26b
    litellm_params:
      model: openai/google/gemma-4-26b-a4b
      api_base: http://127.0.0.1:1234/v1
      api_key: lm-studio
  - model_name: qwen3.5-27b
    litellm_params:
      model: openai/qwen/qwen3.5-27b
      api_base: http://127.0.0.1:1234/v1
      api_key: lm-studio
  - model_name: devstral
    litellm_params:
      model: openai/mistralai/devstral-small-2-2512
      api_base: http://127.0.0.1:1234/v1
      api_key: lm-studio
  - model_name: deepseek-r1-local
    litellm_params:
      model: openai/deepseek/deepseek-r1-0528-qwen3-8b
      api_base: http://127.0.0.1:1234/v1
      api_key: lm-studio

  # ─── Alexander Symphony+ (Ollama, GPU 1) ────────────────────────────────
  # Used by /media/knight2/EDS2/projects/alexander. Aliases are intentionally
  # short (hermes-3-8b not hermes3:8b) so roster.yaml stays readable.
  - model_name: hermes-3-8b
    litellm_params:
      model: ollama_chat/hermes3:8b
      api_base: http://127.0.0.1:11434
  - model_name: hermes-3-3b
    litellm_params:
      model: ollama_chat/hermes3:3b
      api_base: http://127.0.0.1:11434
  - model_name: hermes-3-70b
    litellm_params:
      model: ollama_chat/hermes3:70b-llama3.1-q4_K_M
      api_base: http://127.0.0.1:11434
  - model_name: deepseek-r1-14b
    litellm_params:
      model: ollama_chat/deepseek-r1:14b
      api_base: http://127.0.0.1:11434
  - model_name: qwen-coder-14b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:14b
      api_base: http://127.0.0.1:11434
  - model_name: qwen-coder-32b
    litellm_params:
      model: ollama_chat/qwen2.5-coder:32b
      api_base: http://127.0.0.1:11434

  # ─── Cloud providers (engage when credentials are configured) ────────────
  # Each `os.environ/X` reference reads the env var pushed in by
  # src/credentials.ts on boot. Missing keys leave the model unusable but
  # don't break LiteLLM startup.
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
  # Athena (Principal Reviewer) runs on Opus 4.8 max — the single PR gate.
  - model_name: claude-opus
    litellm_params:
      model: anthropic/claude-opus-4-8
      api_key: os.environ/ANTHROPIC_API_KEY
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY
  # GPT-5.5 (premium, tier-3). Engages the moment OPENAI_API_KEY is set. Note: a
  # chatgpt.com *subscription* does NOT provide this key — it needs a separate
  # platform.openai.com API key with its own usage billing. Confirm the exact
  # model id against `curl https://api.openai.com/v1/models` before relying on it.
  - model_name: gpt-5.5
    litellm_params:
      model: openai/gpt-5.5
      api_key: os.environ/OPENAI_API_KEY
  - model_name: grok
    litellm_params:
      model: xai/grok-2-latest
      api_key: os.environ/XAI_API_KEY
  - model_name: deepseek-chat
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: kimi
    litellm_params:
      model: openai/moonshot-v1-128k
      api_base: https://api.moonshot.cn/v1
      api_key: os.environ/MOONSHOT_API_KEY
  - model_name: perplexity
    litellm_params:
      model: perplexity/sonar-pro
      api_key: os.environ/PPLX_API_KEY
  - model_name: mistral-large
    litellm_params:
      model: mistral/mistral-large-latest
      api_key: os.environ/MISTRAL_API_KEY
  - model_name: gemini
    litellm_params:
      model: gemini/gemini-1.5-pro
      api_key: os.environ/GOOGLE_API_KEY

# Routing settings — fall through cheap-and-fast first (Phi-4) then escalate.
router_settings:
  routing_strategy: simple-shuffle
  num_retries: 1
  timeout: 60

# Budget / rate limits (tune later as cost data arrives)
litellm_settings:
  drop_params: true       # silently drop unsupported params per provider
  set_verbose: false
  request_timeout: 60

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY  # set this before exposing publicly
  database_url: null      # in-memory; switch to Postgres for prod
